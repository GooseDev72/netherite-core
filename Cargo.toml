[package]
name = "netherite-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "netherite_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "net", "process", "macros", "sync", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
futures = "0.3"
tracing = "0.1"
flate2 = "1"
v2keylib = { git = "https://github.com/GooseDev72/v2keylib.git" }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rsa = { version = "0.9", features = ["pem"] }
chacha20poly1305 = "0.10"
rand = "0.8"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"], optional = true }
